services:
  - type: web
    name: nexusdesk-helpdesk
    runtime: docker
    plan: starter
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: nexusdesk-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: LOG_TO_STDOUT
        value: "True"
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexusdesk-postgres
          property: connectionString
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

databases:
  - name: nexusdesk-postgres
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
