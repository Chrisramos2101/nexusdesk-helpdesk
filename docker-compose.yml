services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexusdesk
      POSTGRES_USER: nexusdesk
      POSTGRES_PASSWORD: ${NEXUSDESK_DB_PASSWORD:-nexusdesk_dev_password}
    ports:
      - "${NEXUSDESK_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusdesk -d nexusdesk"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nexusdesk:
    build: .
    ports:
      - "${NEXUSDESK_APP_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nexusdesk:${NEXUSDESK_DB_PASSWORD:-nexusdesk_dev_password}@postgres:5432/nexusdesk
      FLASK_ENV: development
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
