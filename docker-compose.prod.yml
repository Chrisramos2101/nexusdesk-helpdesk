services:
  nexusdesk:
    build: .
    ports:
      - "${NEXUSDESK_APP_PORT:-5000}:5000"
    env_file:
      - .env.production
    environment:
      FLASK_ENV: production
    volumes:
      - nexusdesk_uploads:/app/uploads
      - nexusdesk_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  nexusdesk_uploads:
  nexusdesk_logs:
