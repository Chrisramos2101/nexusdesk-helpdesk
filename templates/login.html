<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="login-page">
    <div class="login-card">
        <div class="logo-circle">🔐</div>

        <h1>NexusDesk Secure Login</h1>
        <p class="login-subtitle">Access your employee support portal or IT admin dashboard.</p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="👤 Username" required>

            <input type="password" name="password" placeholder="🔒 Password" required>

            <button type="submit">Login to Portal</button>
        </form>

        <div class="login-links">
            <a href="#" onclick="showForgotPassword()">Forgot password?</a>
            <span>•</span>
            <a href="#" onclick="showContactIT()">Contact IT Support</a>
        </div>

        <p class="security-note">Role-based access protected system</p>
    </div>
</div>

<footer class="login-footer">
    © 2026 NexusDesk Help Desk Portal · Secure Internal System
</footer>

<div id="customModal" class="modal-overlay">
    <div class="modal-card">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div class="modal-icon" id="modalIcon">🔐</div>
        <h2 id="modalTitle">Title</h2>
        <p id="modalText">Message</p>
    </div>
</div>

<script>
    function showForgotPassword() {
        document.getElementById("modalIcon").textContent = "🔐";
        document.getElementById("modalTitle").textContent = "Demo Login Information";
        document.getElementById("modalText").innerHTML =
            "<strong>Employee Portal</strong><br>" +
            "Username: employee<br>" +
            "Password: employee123<br><br>" +
            "<strong>IT Admin Portal</strong><br>" +
            "Username: admin<br>" +
            "Password: admin123";

        document.getElementById("customModal").classList.add("show-modal");
    }

    function showContactIT() {
        document.getElementById("modalIcon").textContent = "🎧";
        document.getElementById("modalTitle").textContent = "Contact IT Support";
        document.getElementById("modalText").innerHTML =
            "Please contact your system administrator or submit a help desk ticket after logging in.";

        document.getElementById("customModal").classList.add("show-modal");
    }

    function closeModal() {
        document.getElementById("customModal").classList.remove("show-modal");
    }
</script>

</body>
</html>
