name: NexusDesk CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: nexusdesk_ci.db
      SECRET_KEY: nexusdesk-ci-secret-key
      FLASK_ENV: testing
      MAIL_SERVER: localhost
      MAIL_PORT: "25"
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-placeholder
      MAIL_DEFAULT_SENDER: ci@example.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python Source
        run: |
          python -m compileall -q app.py database routes services

      - name: Run Test Suite
        run: |
          python -m pytest --cov=app --cov=database --cov=routes --cov=services --cov-branch --cov-report=term-missing

      - name: Docker Build Test
        run: |
          docker build -t nexusdesk .


  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexusdesk_test
          POSTGRES_PASSWORD: nexusdesk_test_password
          POSTGRES_DB: nexusdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusdesk_test -d nexusdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexusdesk_test:nexusdesk_test_password@127.0.0.1:5432/nexusdesk_test
      SECRET_KEY: nexusdesk-postgres-ci-secret-key
      FLASK_ENV: testing
      MAIL_SERVER: localhost
      MAIL_PORT: "25"
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-placeholder
      MAIL_DEFAULT_SENDER: ci@example.com
      MAIL_SUPPRESS_SEND: "True"
      BOOTSTRAP_ADMIN_USERNAME: ""
      SEED_DEMO_DATA: "false"
      NEXUSDESK_ALLOW_PG_TEST_WRITES: "1"


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Initialize PostgreSQL Test Schema
        run: |
          python run_postgres_schema.py

      - name: Run PostgreSQL Integration Smoke Test
        run: |
          python scripts/postgres_smoke.py

      - name: Run PostgreSQL Transaction and Integrity Tests
        run: |
          python scripts/postgres_integrity_tests.py

