name: NexusDesk CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: nexusdesk_ci.db
      SECRET_KEY: nexusdesk-ci-secret-key
      FLASK_ENV: testing
      MAIL_SERVER: localhost
      MAIL_PORT: "25"
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-placeholder
      MAIL_DEFAULT_SENDER: ci@example.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python Source
        run: |
          python -m compileall -q app.py database routes services

      - name: Run Test Suite
        run: |
          pytest --cov=app --cov=database --cov=routes --cov=services --cov-report=term-missing

      - name: Docker Build Test
        run: |
          docker build -t nexusdesk .
